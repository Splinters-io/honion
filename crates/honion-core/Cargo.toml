[package]
name = "honion-core"
description = "Byte-exact Tor v3 onion address construction, and the vanity pattern language."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
sha3.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
curve25519-dalek.workspace = true
proptest = "1"

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
indexing_slicing = "warn"
panic = "warn"
unwrap_used = "warn"
expect_used = "warn"
